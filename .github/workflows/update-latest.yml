name: Update Latest
on:
  schedule: [{cron: '0 6,18 * * *'}]
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install httpx requests
      - run: python scripts/update_readme.py
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      - run: |
          git config user.name "readme-bot"
          git config user.email "bot@users.noreply.github.com"
          git add README.md
          test -f .fb_last_post_id && git add .fb_last_post_id || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update latest $(date -u +%Y-%m-%d)" && git push)
